<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none">
  <!-- Corps principal -->
  <rect x="3" y="5" width="14" height="13" rx="1" fill="#0F6B3A"/>
  <!-- Aile gauche -->
  <rect x="1" y="9" width="5" height="9" rx="1" fill="#0D5C33"/>
  <!-- Aile droite -->
  <rect x="14" y="9" width="5" height="9" rx="1" fill="#0D5C33"/>
  <!-- Toit -->
  <rect x="3" y="3.5" width="14" height="3" rx="0.8" fill="#2ECC71"/>
  <!-- Grande croix centrale -->
  <rect x="9" y="7" width="2.2" height="7" rx="0.4" fill="white"/>
  <rect x="7" y="9" width="6" height="2.2" rx="0.4" fill="white"/>
  <!-- Porte entrée -->
  <rect x="8.5" y="14" width="3" height="4" rx="0.4" fill="white" opacity="0.5"/>
</svg>
